<!DOCTYPE html>
<html>
<head><title>SSE Test</title></head>
<body>
<h1>EventSource Test</h1>
<div id="log"></div>
<script>
const log = document.getElementById('log');
let eventCount = 0;

const source = new EventSource('http://localhost:3030/_tower-livereload/event-stream');
let serverInstanceId = null;

source.addEventListener('open', () => {
  log.innerHTML += `<p>[${new Date().toISOString()}] Connection opened</p>`;
});

source.addEventListener('error', (e) => {
  log.innerHTML += `<p style="color:red">[${new Date().toISOString()}] Error: ${e.type}, readyState: ${source.readyState}</p>`;
});

source.addEventListener('init', (event) => {
  eventCount++;
  const newInstanceId = event.data;
  log.innerHTML += `<p>[${new Date().toISOString()}] Init event #${eventCount}: ${newInstanceId}, previous: ${serverInstanceId}</p>`;
  
  if (serverInstanceId !== null && serverInstanceId !== newInstanceId) {
    log.innerHTML += `<p style="color:orange">WOULD RELOAD: ${serverInstanceId} !== ${newInstanceId}</p>`;
  }
  
  serverInstanceId = newInstanceId;
});

source.addEventListener('reload', () => {
  log.innerHTML += `<p style="color:blue">[${new Date().toISOString()}] Reload event</p>`;
});
</script>
</body>
</html>
